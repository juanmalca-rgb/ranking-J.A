```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialPremios - Iniciar sesión</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <div class="logo">🚀</div>

        <h1>SocialPremios</h1>

        <p class="subtitle">
            Publica, participa y consigue recompensas.
        </p>

        <form id="loginForm">

            <label>Usuario</label>
            <input
                type="text"
                id="loginUser"
                placeholder="Tu usuario"
                required
            >

            <label>Contraseña</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Tu contraseña"
                required
            >

            <button type="submit" class="primary-btn">
                Iniciar sesión
            </button>

        </form>

        <p id="loginMessage" class="message"></p>

        <div class="auth-links">
            <p>¿No tienes una cuenta?</p>

            <a href="registro.html">
                Crear cuenta
            </a>

            <a href="admin.html">
                Panel administrador
            </a>
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
```
